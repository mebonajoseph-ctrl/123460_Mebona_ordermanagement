version: 0.2

env:
  variables:
    GOPATH: "/go"
    GOCACHE: "/root/.cache/go-build"

phases:
  install:
    runtime-versions:
      golang: 1.22
    commands:
      - echo "Setting up Go build environment..."
      - go version

  pre_build:
    commands:
      - echo "Cleaning and downloading dependencies..."
      - go mod tidy
      - echo "Running unit tests and concurrency validation..."
      # Runs all tests including order concurrency tests
      - go test -v ./tests/... -run TestOrderConcurrency

  build:
    commands:
      - echo "Testing passed. Compiling binary for Linux (Elastic Beanstalk)..."
      - mkdir -p bin
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bin/application main.go

  post_build:
    commands:
      - echo "Build and tests completed successfully on `date`"

artifacts:
  files:
    - bin/application
    - Procfile
    - .env.example
  discard-paths: no