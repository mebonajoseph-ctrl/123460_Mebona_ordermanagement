version: 0.2

env:
  variables:
    GOCACHE: "/tmp/go-cache"
    GOPATH: "/tmp/go"

phases:
  install:
    runtime-versions:
      golang: 1.22
    commands:
      - echo "Setting up Go cache and directories..."
      - mkdir -p /tmp/go-cache /tmp/go
      - echo "Installing dependencies and updating module sums..."
      - go mod tidy
  pre_build:
    commands:
      - echo "Starting Pre-Build Phase..."
      - echo "Running Unit & Concurrency Tests..."
      - go test -v ./...
  build:
    commands:
      - echo "Starting Build Phase..."
      - echo "Compiling Go binary for 64-bit Linux deployment..."
      - mkdir -p bin
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o bin/application main.go
  post_build:
    commands:
      - echo "Build and test phases completed successfully on $(date)."

artifacts:
  files:
    - bin/application
    - Procfile
    - .env.example
  discard-paths: no